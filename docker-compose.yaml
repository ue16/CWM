services:
  backend:
    build:
      context: ./backend/
      target: aio
    ports:
      - "8082:80"
    env_file: ./backend/.env
    networks:
      - private
      - public
    depends_on:
      - database

  auth:
    build:
      context: ./backend/
      target: auth
    env_file: ./backend/.env
    networks:
      - private
    depends_on:
      - database

  frontend:
    build: ./frontend/
    ports:
      - "8081:80"
    networks:
      - private
      - public

  proxy:
    image: caddy:2
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - private
      - public

  database:
    image: postgres:16
    environment:
      POSTGRES_USER: server
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: kanban
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./seed:/docker-entrypoint-initdb.d:ro
    networks:
      - private
      - public

networks:
  private:
    internal: true
  public:

volumes:
  postgres_data:
