x-microservice-base: &base
  env_file: ./backend/.env
  networks:
    - private
  depends_on:
    - database

services:
  auth:
    <<: *base
    build:
      context: ./backend/
      target: auth

  board:
    <<: *base
    build:
      context: ./backend/
      target: board

  card:
    <<: *base
    build:
      context: ./backend/
      target: card
    deploy:
      replicas: 3

  column:
    <<: *base
    build:
      context: ./backend/
      target: column
    deploy:
      replicas: 2

  docs:
    <<: *base
    build:
      context: ./backend/
      target: docs

  overview:
    <<: *base
    build:
      context: ./backend/
      target: overview
    deploy:
      replicas: 2

  frontend:
    build: ./frontend/
    ports:
      - "8081:80"
    networks:
      - private
      - public

  proxy:
    image: caddy:2
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - private
      - public

  database:
    image: postgres:16
    environment:
      POSTGRES_USER: server
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: kanban
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./seed:/docker-entrypoint-initdb.d:ro
    networks:
      - private
      - public

networks:
  private:
    internal: true
  public:

volumes:
  postgres_data:
