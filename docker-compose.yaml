include:
  - ./docker-compose.mongodb.yaml

# This is a YAML anchor. We can use it later on so we don;t have to repeat the
# same configuration all the time.
# Things starting with 'x-' are ignored by compose.
x-microservice-base: &base
  env_file: ./backend/.env
  networks:
    - private

services:
  auth:
    <<: *base # Here we use the anchor to include the env, network and depends.
    build:
      context: ./backend/
      target: auth

  board:
    <<: *base
    build:
      context: ./backend/
      target: board

  card:
    <<: *base
    build:
      context: ./backend/
      target: card
    deploy:
      replicas: 3

  column:
    <<: *base
    build:
      context: ./backend/
      target: column
    deploy:
      replicas: 2

  docs:
    <<: *base
    build:
      context: ./backend/
      target: docs

  overview:
    <<: *base
    build:
      context: ./backend/
      target: overview
    deploy:
      replicas: 2

  frontend:
    build: ./frontend/
    ports:
      - "8081:80"
    networks:
      - private
      - public

  proxy:
    image: caddy:2
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - private
      - public

  database:
    image: postgres:16
    environment:
      POSTGRES_USER: server
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: kanban
    profiles:
      - postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./seed:/docker-entrypoint-initdb.d:ro
    networks:
      - private
      - public

  mongodb:
    image: mongo:8
    profiles:
      - mongodb-single
    volumes:
      - mongodb_data:/data/db
      - ./seed:/docker-entrypoint-initdb.d:ro
    networks:
      - private
      - public

  filestore:
    image: scireum/s3-ninja:latest
    ports:
      - 9000:9000
    volumes:
      - filestore_data:/home/sirius/data
    networks:
      - private
      - public

networks:
  private:
    internal: true
  public:

volumes:
  mongodb_data:
  postgres_data:
  filestore_data:
