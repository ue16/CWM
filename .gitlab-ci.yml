stages:
  - test
  - build

variables:
  GOPATH: "$CI_PROJECT_DIR/.cache"

default:
  image: golang:1.25
  before_script:
    - mkdir -p .cache
    - go mod download
  cache:
    paths:
      - .cache

go-build:
  stage: build
  script:
    - go build -o ./server .
  artifacts:
    paths:
      - ./server

go-test:
  stage: test
  script:
    - go test ./... -v -coverprofile=coverage.out
    - go tool cover -html coverage.out -o coverage.html
  artifacts:
    paths:
      - coverage.html
