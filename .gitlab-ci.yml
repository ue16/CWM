stages:
  - test
  - build
  - release

variables:
  GOPATH: "$CI_PROJECT_DIR/.cache"

default:
  image: golang:1.25
  before_script:
    - mkdir -p .cache
    - ls -al
    - go install github.com/swaggo/swag/cmd/swag@latest
    - go -C ./backend/ mod download
  cache:
    paths:
      - .cache

go-build:
  stage: build
  script:
    - go -C ./backend/ build -o ./server .
  artifacts:
    paths:
      - ./backend/server

go-test:
  stage: test
  script:
    - go -C ./backend/ test ./... -v -coverprofile=coverage.out
    - go -C ./backend/ tool cover -html coverage.out -o coverage.html
  coverage: '/coverage: \d+.\d+% of statements/'
  artifacts:
    paths:
      - backend/coverage.html

frontend-build:
  stage: build
  image: node:24
  before_script:
    - yarn --cwd ./frontend/ install --frozen-lockfile --cache-folder ../.yarn
  script:
    - yarn --cwd ./frontend/ build
  cache:
    paths:
      - .yarn
  artifacts:
    paths:
      - frontend/dist/

go-release:
  stage: release
  image:
    name: goreleaser/goreleaser
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    # Disable shallow cloning so that goreleaser can diff between tags to
    # generate a changelog.
    GIT_DEPTH: 0
  script:
    - goreleaser release --clean
