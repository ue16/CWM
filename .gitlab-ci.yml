stages:
  - test
  - build
  - release

variables:
  GOPATH: "$CI_PROJECT_DIR/.cache"

default:
  image: golang:1.25
  before_script:
    - mkdir -p .cache
    - go mod download
  cache:
    paths:
      - .cache

go-build:
  stage: build
  script:
    - go build -o ./server .
  artifacts:
    paths:
      - ./server

go-test:
  stage: test
  script:
    - go test ./... -v -coverprofile=coverage.out
    - go tool cover -html coverage.out -o coverage.html
  artifacts:
    paths:
      - coverage.html

go-release:
  stage: release
  image:
    name: goreleaser/goreleaser
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    # Disable shallow cloning so that goreleaser can diff between tags to
    # generate a changelog.
    GIT_DEPTH: 0
  script:
    - goreleaser release --clean
