basePath: /
definitions:
  internal.AttachmentResponse:
    properties:
      filename:
        type: string
      id:
        type: integer
      size:
        type: integer
      type:
        type: string
      url:
        type: string
    type: object
  internal.AuthResponse:
    properties:
      message:
        type: string
      success:
        type: boolean
      token:
        type: string
      user:
        $ref: '#/definitions/internal.User'
    type: object
  internal.Board:
    properties:
      id:
        type: integer
      name:
        type: string
      user_id:
        type: integer
    type: object
  internal.Card:
    properties:
      attachments:
        items:
          $ref: '#/definitions/internal.AttachmentResponse'
        type: array
      column_id:
        type: integer
      description:
        type: string
      id:
        type: integer
      position:
        type: integer
      title:
        type: string
      user_id:
        type: integer
    type: object
  internal.Column:
    properties:
      board_id:
        type: integer
      id:
        type: integer
      name:
        type: string
      position:
        type: integer
      user_id:
        type: integer
    type: object
  internal.IdRequest:
    properties:
      id:
        type: integer
    type: object
  internal.JSONError:
    properties:
      error:
        type: string
    type: object
  internal.JSONMessage:
    properties:
      message:
        type: string
    type: object
  internal.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  internal.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/internal.User'
    type: object
  internal.NameRequest:
    properties:
      name:
        type: string
    type: object
  internal.PrepareAttachmentRequest:
    properties:
      filename:
        type: string
      filetype:
        type: string
    type: object
  internal.PrepareAttachmentResponse:
    properties:
      id:
        type: integer
      url:
        type: string
    type: object
  internal.RegisterRequest:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  internal.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      username:
        type: string
    type: object
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a small kanban server.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: CWM Kanban
  version: "0.3"
paths:
  /api/v2/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user with username and password. Returns a login
        token that should be used in subsequent requests in the format 'Bearer x:xyz'.
      parameters:
      - description: Login credentials
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/internal.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            $ref: '#/definitions/internal.LoginResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/internal.JSONError'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/internal.JSONError'
        "500":
          description: Server error
          schema:
            $ref: '#/definitions/internal.JSONError'
      summary: Login user
      tags:
      - auth
  /api/v2/auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account.
      parameters:
      - description: Registration details
        in: body
        name: registerReq
        required: true
        schema:
          $ref: '#/definitions/internal.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
          schema:
            $ref: '#/definitions/internal.AuthResponse'
        "400":
          description: Invalid request or user exists
          schema:
            $ref: '#/definitions/internal.JSONError'
        "500":
          description: Server error
          schema:
            $ref: '#/definitions/internal.JSONError'
      summary: Register a new user
      tags:
      - auth
  /api/v2/auth/verify:
    get:
      consumes:
      - application/json
      description: Verify if the provided token is valid.
      parameters:
      - description: Bearer token from login
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Token is valid
          schema:
            $ref: '#/definitions/internal.User'
        "401":
          description: Invalid token
          schema:
            $ref: '#/definitions/internal.JSONError'
      summary: Verify authentication token
      tags:
      - auth
  /api/v2/board/:
    delete:
      consumes:
      - application/json
      description: Delete a board by its ID.
      parameters:
      - description: Bearer token from login
        in: header
        name: Authorization
        required: true
        type: string
      - description: Board id
        in: body
        name: board
        required: true
        schema:
          $ref: '#/definitions/internal.IdRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Board deleted successfully
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/internal.JSONError'
        "401":
          description: Invalid auth token
          schema:
            $ref: '#/definitions/internal.JSONError'
        "404":
          description: Board not found
          schema:
            $ref: '#/definitions/internal.JSONError'
        "500":
          description: Failed to delete board
          schema:
            $ref: '#/definitions/internal.JSONError'
      summary: Delete Board
      tags:
      - Boards
    post:
      consumes:
      - application/json
      description: Create a new board for the authenticated user.
      parameters:
      - description: Bearer token from login
        in: header
        name: Authorization
        required: true
        type: string
      - description: User ID
        in: header
        name: User-ID
        required: true
        type: string
      - description: Board creation request
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/internal.NameRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created board
          schema:
            $ref: '#/definitions/internal.Board'
        "400":
          description: Invalid input or missing name
          schema:
            $ref: '#/definitions/internal.JSONError'
        "401":
          description: Invalid auth token
          schema:
            $ref: '#/definitions/internal.JSONError'
        "500":
          description: Failed to create board
          schema:
            $ref: '#/definitions/internal.JSONError'
      summary: Create Board
      tags:
      - Boards
    put:
      consumes:
      - application/json
      description: Update a board's details.
      parameters:
      - description: Bearer token from login
        in: header
        name: Authorization
        required: true
        type: string
      - description: User ID
        in: header
        name: User-ID
        required: true
        type: string
      - description: Board object
        in: body
        name: board
        required: true
        schema:
          $ref: '#/definitions/internal.Board'
      produces:
      - application/json
      responses:
        "200":
          description: Board updated successfully
          schema:
            $ref: '#/definitions/internal.JSONMessage'
        "400":
          description: Invalid JSON body or missing fields
          schema:
            $ref: '#/definitions/internal.JSONError'
        "401":
          description: Invalid auth token
          schema:
            $ref: '#/definitions/internal.JSONError'
        "500":
          description: Failed to update board
          schema:
            $ref: '#/definitions/internal.JSONError'
      summary: Update Board
      tags:
      - Boards
  /api/v2/board/{boardId}:
    get:
      consumes:
      - application/json
      description: Fetch a board by its ID.
      parameters:
      - description: Bearer token from login
        in: header
        name: Authorization
        required: true
        type: string
      - description: Board ID
        in: path
        name: boardId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Board details
          schema:
            $ref: '#/definitions/internal.Board'
        "400":
          description: Invalid board ID
          schema:
            $ref: '#/definitions/internal.JSONError'
        "401":
          description: Invalid auth token
          schema:
            $ref: '#/definitions/internal.JSONError'
        "404":
          description: Board not found
          schema:
            $ref: '#/definitions/internal.JSONError'
        "500":
          description: Failed to encode response
          schema:
            $ref: '#/definitions/internal.JSONError'
      summary: Get Board
      tags:
      - Boards
  /api/v2/boards:
    get:
      consumes:
      - application/json
      description: Lists all boards belonging to the authenticated user.
      parameters:
      - description: Bearer token from login
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of boards
          schema:
            items:
              $ref: '#/definitions/internal.Board'
            type: array
        "401":
          description: Invalid auth token
          schema:
            $ref: '#/definitions/internal.JSONError'
        "500":
          description: Failed to process boards
          schema:
            $ref: '#/definitions/internal.JSONError'
      summary: List all boards for a user
      tags:
      - All-Boards
  /api/v2/card/:
    delete:
      consumes:
      - application/json
      description: Delete a card by its ID.
      parameters:
      - description: Bearer token from login
        in: header
        name: Authorization
        required: true
        type: string
      - description: Card id
        in: body
        name: card
        required: true
        schema:
          $ref: '#/definitions/internal.IdRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Card deleted successfully
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/internal.JSONError'
        "401":
          description: Invalid auth token
          schema:
            $ref: '#/definitions/internal.JSONError'
        "404":
          description: Card not found
          schema:
            $ref: '#/definitions/internal.JSONError'
        "500":
          description: Failed to delete card
          schema:
            $ref: '#/definitions/internal.JSONError'
      summary: Delete Card
      tags:
      - Cards
    post:
      consumes:
      - application/json
      description: Create a new card in a specific column.
      parameters:
      - description: Bearer token from login
        in: header
        name: Authorization
        required: true
        type: string
      - description: Card creation payload
        in: body
        name: card
        required: true
        schema:
          type: object
      - description: Column ID
        in: body
        name: card.column_id
        required: true
        schema:
          type: integer
      - description: Card title
        in: body
        name: card.title
        required: true
        schema:
          type: string
      - description: Card description
        in: body
        name: card.description
        schema:
          type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal.Card'
        "400":
          description: Invalid input or missing required fields
          schema:
            $ref: '#/definitions/internal.JSONError'
        "401":
          description: Invalid auth token
          schema:
            $ref: '#/definitions/internal.JSONError'
        "500":
          description: Failed to create card
          schema:
            $ref: '#/definitions/internal.JSONError'
      summary: Create Card
      tags:
      - Cards
    put:
      consumes:
      - application/json
      description: Update a card's details.
      parameters:
      - description: Bearer token from login
        in: header
        name: Authorization
        required: true
        type: string
      - description: Card object
        in: body
        name: card
        required: true
        schema:
          $ref: '#/definitions/internal.Card'
      produces:
      - application/json
      responses:
        "200":
          description: Card updated successfully
          schema:
            $ref: '#/definitions/internal.JSONMessage'
        "400":
          description: Invalid JSON body or missing fields
          schema:
            $ref: '#/definitions/internal.JSONError'
        "401":
          description: Invalid auth token
          schema:
            $ref: '#/definitions/internal.JSONError'
        "500":
          description: Failed to update card
          schema:
            $ref: '#/definitions/internal.JSONError'
      summary: Update Card
      tags:
      - Cards
  /api/v2/card/{cardId}/attachment/{attachmentId}:
    delete:
      consumes:
      - application/json
      description: Delete an attachment from the database and remove it from S3 storage.
      parameters:
      - description: Bearer token from login
        in: header
        name: Authorization
        required: true
        type: string
      - description: Card ID
        in: path
        name: cardId
        required: true
        type: integer
      - description: Attachment ID
        in: path
        name: attachmentId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Attachment deleted successfully
        "401":
          description: Invalid auth token
          schema:
            $ref: '#/definitions/internal.JSONError'
        "404":
          description: Attachment or card not found
          schema:
            $ref: '#/definitions/internal.JSONError'
        "500":
          description: Failed to delete attachment
          schema:
            $ref: '#/definitions/internal.JSONError'
      summary: Delete Attachment
      tags:
      - Attachments
  /api/v2/card/{cardId}/attachment/{attachmentId}/finalize:
    put:
      consumes:
      - application/json
      description: Verify that the file was uploaded to S3 and mark the attachment
        as active.
      parameters:
      - description: Bearer token from login
        in: header
        name: Authorization
        required: true
        type: string
      - description: Card ID
        in: path
        name: cardId
        required: true
        type: integer
      - description: Attachment ID
        in: path
        name: attachmentId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Attachment finalized successfully
          schema:
            $ref: '#/definitions/internal.AttachmentResponse'
        "401":
          description: Invalid auth token
          schema:
            $ref: '#/definitions/internal.JSONError'
        "404":
          description: Attachment or card not found
          schema:
            $ref: '#/definitions/internal.JSONError'
        "500":
          description: Failed to finalize attachment
          schema:
            $ref: '#/definitions/internal.JSONError'
      summary: Finalize Attachment
      tags:
      - Attachments
  /api/v2/card/{cardId}/attachment/prepare:
    put:
      consumes:
      - application/json
      description: Create an attachment metadata entry and get a presigned URL for
        uploading to S3.
      parameters:
      - description: Bearer token from login
        in: header
        name: Authorization
        required: true
        type: string
      - description: Card ID
        in: path
        name: cardId
        required: true
        type: integer
      - description: Attachment preparation payload
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/internal.PrepareAttachmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: URL and attachment ID
          schema:
            $ref: '#/definitions/internal.PrepareAttachmentResponse'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/internal.JSONError'
        "401":
          description: Invalid auth token
          schema:
            $ref: '#/definitions/internal.JSONError'
        "404":
          description: Card not found
          schema:
            $ref: '#/definitions/internal.JSONError'
        "500":
          description: Failed to prepare attachment
          schema:
            $ref: '#/definitions/internal.JSONError'
      summary: Prepare Attachment
      tags:
      - Attachments
  /api/v2/card/{columnId}:
    get:
      consumes:
      - application/json
      description: Fetch all cards for a specific column.
      parameters:
      - description: Bearer token from login
        in: header
        name: Authorization
        required: true
        type: string
      - description: Column ID
        in: path
        name: columnId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "401":
          description: Invalid auth token
          schema:
            $ref: '#/definitions/internal.JSONError'
      summary: Get Cards
      tags:
      - Cards
  /api/v2/column/:
    delete:
      consumes:
      - application/json
      description: Delete a column by its ID.
      parameters:
      - description: Bearer token from login
        in: header
        name: Authorization
        required: true
        type: string
      - description: Column ID
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/internal.IdRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Column deleted successfully
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/internal.JSONError'
        "401":
          description: Invalid auth token
          schema:
            $ref: '#/definitions/internal.JSONError'
        "404":
          description: Column not found
          schema:
            $ref: '#/definitions/internal.JSONError'
        "500":
          description: Failed to delete column
          schema:
            $ref: '#/definitions/internal.JSONError'
      summary: Delete Column
      tags:
      - Columns
    post:
      consumes:
      - application/json
      description: Create a new column in a specific board.
      parameters:
      - description: Bearer token from login
        in: header
        name: Authorization
        required: true
        type: string
      - description: Column creation payload
        in: body
        name: input
        required: true
        schema:
          type: object
      - description: Board ID
        in: body
        name: input.board_id
        required: true
        schema:
          type: integer
      - description: Column name
        in: body
        name: input.name
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal.Column'
        "400":
          description: Invalid input or missing fields
          schema:
            $ref: '#/definitions/internal.JSONError'
        "401":
          description: Invalid auth token
          schema:
            $ref: '#/definitions/internal.JSONError'
        "500":
          description: Failed to create column
          schema:
            $ref: '#/definitions/internal.JSONError'
      summary: Create Column
      tags:
      - Columns
    put:
      consumes:
      - application/json
      description: Update a column's details.
      parameters:
      - description: Bearer token from login
        in: header
        name: Authorization
        required: true
        type: string
      - description: Column object
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/internal.Column'
      produces:
      - application/json
      responses:
        "200":
          description: Column updated successfully
          schema:
            $ref: '#/definitions/internal.JSONMessage'
        "400":
          description: Invalid JSON body or missing fields
          schema:
            $ref: '#/definitions/internal.JSONError'
        "401":
          description: Invalid auth token
          schema:
            $ref: '#/definitions/internal.JSONError'
        "500":
          description: Failed to update column
          schema:
            $ref: '#/definitions/internal.JSONError'
      summary: Update Column
      tags:
      - Columns
  /api/v2/column/{boardId}:
    get:
      consumes:
      - application/json
      description: Fetch all columns for a specific board.
      parameters:
      - description: Bearer token from login
        in: header
        name: Authorization
        required: true
        type: string
      - description: Board ID
        in: path
        name: boardId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal.Column'
            type: array
        "400":
          description: Invalid board ID
          schema:
            $ref: '#/definitions/internal.JSONError'
        "401":
          description: Invalid auth token
          schema:
            $ref: '#/definitions/internal.JSONError'
        "500":
          description: Failed to fetch columns
          schema:
            $ref: '#/definitions/internal.JSONError'
      summary: Get Columns
      tags:
      - Columns
swagger: "2.0"
